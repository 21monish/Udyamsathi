name: Validate backend and sync Supabase data

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/supabase-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-sync
  cancel-in-progress: false

jobs:
  validate-and-sync:
    name: Validate backend and sync production data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify runtime imports
        run: python -c "from jose import jwt; import httpx; import sqlalchemy; print('Backend runtime dependencies are available')"
      - name: Run backend validation
        run: |
          python -m compileall -q app scripts
          python -m tests.verify_all_models
      - name: Verify Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "Missing repository secret: SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "Missing repository secret: SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
      - name: Sync production data to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_supabase_rest.py
